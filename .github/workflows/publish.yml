name: Publish

on:
  push:
    tags:
      - 'v*'
  # Re-run for a version already on npm (e.g. ClawHub failed): skips npm, publishes ClawHub.
  # Dispatch from the default branch (so this YAML loads) with the tag to publish.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.2)
        required: true
        type: string

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release
      id-token: write # npm trusted publishing (OIDC)
    outputs:
      tag: ${{ steps.src.outputs.tag }}
      sha: ${{ steps.src.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: src
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5; Node 22 ships 10.x.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Already on npm?
        id: published
        run: |
          name=$(jq -r .name package.json); version=$(jq -r .version package.json)
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$name@$version is already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # prepublishOnly runs `pnpm check` (typecheck, tests, build, manifest, throwaway host).
      # No token: the registry trusts this repo + workflow via OIDC.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
      - if: steps.published.outputs.skip == 'true'
        run: pnpm check
      # The exact tarball npm got, for ClawHub below.
      - run: mkdir -p "$RUNNER_TEMP/pack" && npm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@v4
        with:
          name: package-tgz
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.src.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes

  # Tag-push publishes to ClawHub need a token; OIDC-only is workflow_dispatch.
  # Waits for the security scan and fails the run if ClawHub blocks the release.
  # Source attribution is passed explicitly: on a dispatch the run's own ref is main.
  clawhub:
    needs: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@main
    with:
      package_artifact_name: package-tgz
      owner: openmail
      family: code-plugin
      dry_run: false
      source_repo: ${{ github.repository }}
      source_commit: ${{ needs.npm.outputs.sha }}
      source_ref: refs/tags/${{ needs.npm.outputs.tag }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
