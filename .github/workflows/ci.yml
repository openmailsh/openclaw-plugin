name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # openclaw.plugin.json and package.json#openclaw are generated; fail if stale.
      - run: pnpm manifest:check
      # Install into a throwaway OpenClaw host and make sure it actually loads.
      - run: pnpm validate-plugin
